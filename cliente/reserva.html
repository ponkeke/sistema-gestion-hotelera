<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Completar reserva | Hotel Raymi</title><link rel="stylesheet" href="css/estilos.css"></head>
<body><header class="cabecera_publica"><a href="index.html"><img class="cabecera_publica__logo" src="img/logo-raymi.png" alt="Hotel Raymi"></a><nav class="cabecera_publica__menu"><a href="index.html">Inicio</a><a href="habitaciones.html">Habitaciones</a></nav><a class="boton boton--secundario" href="habitaciones.html">Volver</a></header>
<main class="contenedor_publico"><div class="titulo_publico"><h1>Completa tu reserva</h1><p>Ingresa tus datos y selecciona una garantía.</p></div><div class="reserva_diseno"><form class="formulario_reserva" data-formulario-reserva novalidate><h2>Datos del huésped</h2><label class="campo_publico">Nombres<input name="nombres" required minlength="2"></label><label class="campo_publico">Apellidos<input name="apellidos" required minlength="2"></label><label class="campo_publico">DNI<input name="dni" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" required></label><label class="campo_publico">Teléfono<input name="telefono" inputmode="tel" pattern="[0-9]{9}" maxlength="9" required></label><label class="campo_publico campo_publico--completo">Correo electrónico<input name="correo" type="email" required></label><h3>Método de garantía</h3><div class="metodos_garantia"><button class="metodo_garantia metodo_garantia--activo" type="button" data-metodo="Tarjeta">💳 Tarjeta</button><button class="metodo_garantia" type="button" data-metodo="Pago en hotel">🏨 Pago en hotel</button></div><label class="aceptar_condiciones"><input name="condiciones" type="checkbox" required> Acepto las condiciones y la política de cancelación.</label><button class="boton confirmar_reserva" type="submit">Confirmar reserva</button></form><aside class="resumen_reserva" data-resumen-reserva></aside></div></main>
<script src="../compartido/datos_demo.js"></script><script src="js/cliente.js"></script></body></html>

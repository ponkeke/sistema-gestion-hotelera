<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuración | Recepción</title><link rel="stylesheet" href="../css/base/variables.css"><link rel="stylesheet" href="../css/base/reset.css"><link rel="stylesheet" href="../css/base/tipografia.css"><link rel="stylesheet" href="../css/componentes/interfaz.css"><link rel="stylesheet" href="../css/componentes/funcionalidad.css"><link rel="stylesheet" href="../css/adaptable.css"></head><body><main style="width:min(760px,92%);margin:50px auto"><a class="boton-secundario" href="dashboard.html">← Volver al panel</a><section class="tarjeta" style="margin-top:28px;padding:32px"><span class="etiqueta">RECEPCIÓN</span><h1 style="margin:12px 0">Configuración del turno</h1><p>Estos datos se utilizan en reservas y en la demostración.</p><form data-configuracion-recepcion style="margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:20px"><label class="campo"><span>Nombre del hotel</span><input name="nombre_hotel" required></label><label class="campo"><span>Huéspedes predeterminados</span><input name="cantidad_huespedes" type="number" min="1" max="8" required></label><label class="campo"><span>Hora de ingreso</span><input name="hora_ingreso" type="time" required></label><label class="campo"><span>Hora de salida</span><input name="hora_salida" type="time" required></label><button class="boton-principal" type="submit">Guardar cambios</button><button class="boton-secundario" type="button" data-reiniciar-datos>Reiniciar datos</button></form></section></main><script src="../../compartido/datos_demo.js"></script><script>const formulario=document.querySelector('[data-configuracion-recepcion]');const cargar=()=>{const c=DatosHotel.obtenerConfiguracion();Object.keys(c).forEach(k=>{if(formulario.elements[k])formulario.elements[k].value=c[k]})};formulario.addEventListener('submit',e=>{e.preventDefault();const c=DatosHotel.obtenerConfiguracion();Object.assign(c,Object.fromEntries(new FormData(formulario)));c.cantidad_huespedes=Number(c.cantidad_huespedes);DatosHotel.guardarConfiguracion(c);alert('Configuración guardada correctamente.')});document.querySelector('[data-reiniciar-datos]').addEventListener('click',()=>{if(confirm('¿Restaurar habitaciones, huéspedes y reservas?')){DatosHotel.reiniciar();cargar();alert('Datos reiniciados.')}});cargar();</script></body></html>
